<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>東京都営バス マップ＆時刻表 - エリア選択</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
      background: linear-gradient(135deg, #0d3b66 0%, #001e3d 100%);
      color: #ffffff;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 860px;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 32px;
    }

    .header-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .brand-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(8px);
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.5px;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    h1 {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -0.5px;
      line-height: 1.3;
    }

    .sub-title {
      font-size: 15px;
      color: #cbd5e0;
      max-width: 540px;
      line-height: 1.6;
    }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 24px;
      margin-top: 8px;
    }

    .area-card {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 20px;
      padding: 32px 24px;
      text-align: left;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      gap: 16px;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }

    .area-card:hover {
      transform: translateY(-6px);
      background: rgba(255, 255, 255, 0.14);
      border-color: rgba(255, 255, 255, 0.35);
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.35);
    }

    .area-card-icon {
      font-size: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 64px;
      height: 64px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.12);
    }

    .area-card-title {
      font-size: 22px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .area-card-badge {
      font-size: 12px;
      padding: 3px 8px;
      border-radius: 6px;
      background: #3182ce;
      color: white;
      font-weight: 600;
    }

    .area-card.tama .area-card-badge {
      background: #38a169;
    }

    .area-card-desc {
      font-size: 14px;
      color: #e2e8f0;
      line-height: 1.5;
    }

    .area-card-stats {
      display: flex;
      gap: 16px;
      margin-top: auto;
      padding-top: 16px;
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      font-size: 13px;
      color: #cbd5e0;
    }

    .stat-item strong {
      color: #ffffff;
      font-size: 16px;
      margin-right: 2px;
    }

    .card-arrow {
      margin-left: auto;
      font-size: 18px;
      color: #a0aec0;
      transition: transform 0.2s;
    }

    .area-card:hover .card-arrow {
      transform: translateX(4px);
      color: #ffffff;
    }

    footer {
      font-size: 12px;
      color: #a0aec0;
      margin-top: 16px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header-section">
      <div class="brand-badge">
        <span>🚌</span>
        <span>東京都交通局 GTFSオープンデータ対応</span>
      </div>
      <h1>東京都営バス マップ＆時刻表</h1>
      <p class="sub-title">閲覧したいエリアを選択してください。エリアごとに最適化されたデータのみを軽量に読み込みます。</p>
    </div>

    <div class="card-grid">
      <!-- 23区エリア -->
      <a href="map.html?area=23" class="area-card" id="card-23">
        <div class="area-card-icon">🏙️</div>
        <div>
          <div class="area-card-title">
            <span>23区エリア</span>
            <span class="area-card-badge">都心部・東部</span>
          </div>
          <p class="area-card-desc" style="margin-top: 6px;">
            東京駅、新宿、渋谷、新橋、品川、池袋、江東など、23区全域をカバーする都営バス路線網。
          </p>
        </div>
        <div class="area-card-stats">
          <div class="stat-item"><strong>140</strong> 系統</div>
          <div class="stat-item"><strong>1,484</strong> 停留所</div>
          <div class="card-arrow">➔</div>
        </div>
      </a>

      <!-- 多摩エリア（青梅） -->
      <a href="map.html?area=tama" class="area-card tama" id="card-tama">
        <div class="area-card-icon">⛰️</div>
        <div>
          <div class="area-card-title">
            <span>多摩エリア</span>
            <span class="area-card-badge">青梅支所管轄</span>
          </div>
          <p class="area-card-desc" style="margin-top: 6px;">
            青梅駅、東青梅、河辺、吉野、小曽木など、豊かな自然と多摩地域を結ぶ都営バス路線網。
          </p>
        </div>
        <div class="area-card-stats">
          <div class="stat-item"><strong>10</strong> 系統</div>
          <div class="stat-item"><strong>189</strong> 停留所</div>
          <div class="card-arrow">➔</div>
        </div>
      </a>
    </div>

    <footer>
      &copy; 東京都営バス インタラクティブマップ | 出典: 東京都交通局 GTFSデータ・国土地理院 地図タイル
    </footer>
  </div>
</body>
</html>
